name: secumerge

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Utilisé à partir de l'Étape 1 (base de données).
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-secumerge}:${POSTGRES_PASSWORD:?Copiez .env.example vers .env avant de lancer}@db:5432/${POSTGRES_DB:-secumerge}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Rechargement à chaud du code et de la configuration ; Alembic écrit sur l'hôte.
      - ./app:/code/app
      - ./tests:/code/tests
      - ./alembic:/code/alembic
      - ./alembic.ini:/code/alembic.ini
      - ./pyproject.toml:/code/pyproject.toml
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secumerge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copiez .env.example vers .env avant de lancer}
      POSTGRES_DB: ${POSTGRES_DB:-secumerge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
